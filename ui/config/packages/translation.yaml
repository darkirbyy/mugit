framework:
    enabled_locales: ['fr']
    set_locale_from_accept_language: true
    set_content_language_from_locale: true
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks:
            - fr
        providers:
        globals:
            '{repoMaxSizeMio}': '%core.repo_max_size_mio%'

when@test:
    framework:
        translator:
            enabled: false

