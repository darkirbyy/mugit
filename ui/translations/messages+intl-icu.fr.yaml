user:
  list:
    title: Gestion des utilisateurs
    noUser: Aucun utilisateur n'a enregistré de clé SSH
    uuid: UUID
    failed: Échec lors du calcul de la liste des utilisateurs.
  keys:
    title: Mes clés SSH
    help: |-
      Pour générer une paire de clés SSH, utiliser la commande 'ssh-keygen' sur Linux. Seul l'algorithme ed25519 est autorisé, utiliser l'option '-t ed25519' si besoin.
      Par défaut, les clés sont générées dans '/home/<user>/.ssh'. Copier/coller le contenu de la clé publique (fichier finissant par .pub) ici.
    list:
      addNew: Ajouter une nouvelle clé SSH
      noKey: Aucune clé SSH
      key: Clé
      dateAdded: Date d'ajout
      comment: Commentaire
      remove: Supprimer
      failed: Échec lors du calcul de la liste des clés SSH.
    add:
      label: Clé SSH publique
      empty: La clé SSH est vide.
      invalid: |-
        La clé SSH n'est pas valide.
        Le seul algorithme autorisé est ed25519.
        Le commentaire peut contenir lettres, chiffres, espaces _, -, et @.
      alreadyExist: La clé SSH existe déjà.
      success: La clé SSH a été correctement ajoutée.
      failed: Échec lors de l'ajout de la clé SSH.
    remove:
      label: La suppression est définitive, confirmer ?
      success: La clé SSH a été correctement supprimée.
      failed: Échec lors de la suppression de cette clé SSH.
  delete:
    failed: Échec lors de la suppression des toutes les clés de l'utilisateur.
    
repo:
  title: Les dépôts
  list:
    createNew: Créer un nouveau dépôt
    noRepo: Aucun dépôt
    name: Nom
    humanReadableSize: Taille
    humanReadableSizeHelp: Un dépôt ne peut excéder {repoMaxSizeMio}Mio
    cloneURL: URL
    rename: Renommer
    delete: Supprimer
    copyURLToClipboard: Copier l'URL dans le presse-papier
    copied: Copié !
    warnSize: '>{repoWarnSizePercent}% du quota'
    failed: Échec lors du calcul de la liste des dépôts.
  create:
    label: Nom
    success: Le dépôt a été correctement créé.
    empty: Le nom est vide.
    invalid: |-
      Le nom n'est pas valide.
      Il peut contenir lettres, chiffres, _ et -.
      Il doit commencer par une lettre.
    alreadyExist: Le nom est déjà utilisé.
    failed: Échec lors de la création du dépôt.
  rename:
    label: Nouveau nom
    success: Le dépôt a été correctement renommé.
    empty: Le nouveau nom est vide.
    invalid: |-
      Le nouveau nom n'est pas valide.
      Il peut contenir lettres, chiffres, _ et -.
      Il doit commencer par une lettre.
    alreadyExist: Le nouveau nom est déjà utilisé.
    failed: Échec lors du renommage de ce dépôt.
  delete:
    label: La suppression est définitive, confirmer ?
    success: Le dépôt a été correctement supprimé.
    failed: Échec lors de la suppression de ce dépôt.
    
log:
  title: Journal d'évènements
  size:
