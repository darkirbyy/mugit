name: ${CORE_NAME:-mugit}
services:
  mugit:
    build:
      context: .
      dockerfile: ./dockerfile
      network: host
      args:
        CORE_UID: ${CORE_UID:-1000}
        CORE_GID: ${CORE_GID:-1000}
    image: alpine:3.24-custom
    container_name: ${CORE_NAME:-mugit}
    restart: unless-stopped
    environment:
      - TZ=${TIMEZONE:-Etc/UTC}
      - UI_ADDR=${CORE_NETWORK_UI_ADDR:-localhost}
      - REPO_MAX_SIZE_MIO=${CORE_REPO_MAX_SIZE_MIO:-500}
    ports:
      - ${CORE_PORT:-22}:22
    volumes:
      - ${CORE_DATA:-./data/dev}:/home/git:rw
      - ./config/no-interactive-login:/home/git/git-shell-commands/no-interactive-login:rw
      - ./config/entrypoint.sh:/entrypoint.sh:ro
      - ./config/sshd_custom.conf:/etc/ssh/sshd_config.d/10_sshd_custom.conf:ro
      - ./config/gitconfig:/etc/gitconfig:ro
      - ./config/pre-receive:/etc/git/hooks/pre-receive:ro
      - ${CORE_KEYS:-./keys/dev}/ssh_host_ed25519_key:/etc/ssh/ssh_host_ed25519_key:rw
      - ${CORE_KEYS:-./keys/dev}/ssh_host_ed25519_key.pub:/etc/ssh/ssh_host_ed25519_key.pub:rw
      - ${CORE_KEYS:-./keys/dev}/ssh_root_ed25519_key.pub:/root/.ssh/authorized_keys:rw
      - ./api.sh:/root/api.sh:ro
    networks:
      - web-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 22"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  web-network:
    external: ${CORE_NETWORK_EXTERNAL:-false}